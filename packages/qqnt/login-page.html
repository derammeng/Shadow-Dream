<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Shadow Dream · QQ 登录</title>
<style>
  :root {
    color-scheme: light;
    --bg: #fdfbff; --text: #211a33; --text-2: #4c4466; --muted: #7b7394;
    --line: #efe9fa; --line-strong: #e2d8f5; --accent: #6a4bf5;
    --gradient: linear-gradient(118deg, #7a5cff 0%, #b06bff 42%, #ff7ab6 100%);
    --gradient-soft: linear-gradient(118deg, rgba(122, 92, 255, 0.12), rgba(255, 122, 182, 0.12));
    --shadow: 0 32px 80px rgba(60, 40, 120, 0.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(900px 520px at 88% -8%, rgba(255, 122, 182, 0.14), transparent 62%),
      radial-gradient(760px 480px at 4% 0%, rgba(122, 92, 255, 0.14), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Inter", "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .box {
    width: min(420px, 100%); padding: 26px;
    background: linear-gradient(170deg, #ffffff, #fbf7ff);
    border: 1px solid var(--line-strong); border-radius: 24px;
    box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; }
  .logo {
    width: 38px; height: 38px; border-radius: 12px; position: relative; flex: none;
    background: var(--gradient);
    box-shadow: 0 10px 24px rgba(122, 92, 255, 0.3);
  }
  .logo::after {
    content: ""; position: absolute; inset: 9px; border-radius: 50%; background: #fff; opacity: 0.96;
    -webkit-mask: radial-gradient(circle at 64% 36%, transparent 40%, #000 43%);
    mask: radial-gradient(circle at 64% 36%, transparent 40%, #000 43%);
  }
  .brand b { font-size: 13px; letter-spacing: 0.1em; font-weight: 800; color: var(--text); }
  .brand span { color: var(--muted); font-size: 11px; display: block; letter-spacing: 0.04em; margin-top: 2px; }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  p { color: var(--muted); font-size: 12.5px; line-height: 1.7; margin: 0 0 18px; }
  label { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; margin: 0 0 6px; }
  input {
    width: 100%; padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 12px;
    background: #fdfbff; color: var(--text); outline: none;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px;
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }
  input:focus { border-color: rgba(122, 92, 255, 0.5); box-shadow: 0 0 0 4px rgba(122, 92, 255, 0.1); }
  button {
    width: 100%; margin-top: 14px; border: 0; border-radius: 999px; padding: 12px;
    background: var(--gradient); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    box-shadow: 0 14px 30px -12px rgba(122, 92, 255, 0.7);
    transition: transform 0.16s ease, box-shadow 0.16s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 18px 34px -12px rgba(122, 92, 255, 0.8); }
  button:disabled { opacity: 0.55; cursor: wait; transform: none; box-shadow: none; }
  .msg { min-height: 18px; margin-top: 10px; font-size: 12px; color: #d8446f; line-height: 1.6; }
  .foot {
    margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line);
    font-size: 10.5px; color: var(--muted); text-align: center; letter-spacing: 0.04em; line-height: 1.6;
  }
  .tabs { display: flex; gap: 4px; background: #f6f1ff; border: 1px solid var(--line-strong); border-radius: 999px; padding: 4px; margin-bottom: 18px; }
  .tab { flex: 1; border: 0; border-radius: 999px; padding: 8px 10px; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; transition: color 0.16s ease, background-color 0.16s ease; }
  .tab.active { background: #fff; color: var(--accent); box-shadow: 0 2px 8px rgba(33, 26, 51, 0.08); }
  .qr { min-height: 250px; border: 1px solid var(--line-strong); border-radius: 18px; background: #fff; display: grid; place-items: center; padding: 14px; }
  .qr img { width: 220px; height: 220px; image-rendering: pixelated; display: none; border-radius: 10px; }
  .qr .wait { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.7; }
  .qr-refresh { margin-top: 10px; width: 100%; border: 1px solid var(--line-strong); border-radius: 999px; padding: 10px; background: #fff; color: var(--text-2); font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: none; }
  .qr-refresh:hover { border-color: rgba(122, 92, 255, 0.4); color: var(--accent); transform: none; box-shadow: none; }
  .qr-refresh:disabled { opacity: 0.5; cursor: wait; }
  .hidden { display: none !important; }
  .quick-panel { margin-bottom: 18px; }
  .quick-title { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .quick-list { display: flex; flex-direction: column; gap: 8px; }
  .quick-card { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 14px; background: #fff; color: var(--text); cursor: pointer; text-align: left; box-shadow: none; margin: 0; transition: border-color 0.16s ease, box-shadow 0.16s ease; }
  .quick-card:hover { border-color: rgba(122, 92, 255, 0.4); box-shadow: 0 6px 18px rgba(33, 26, 51, 0.06); transform: none; }
  .quick-card:disabled { opacity: 0.55; cursor: wait; }
  .quick-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--gradient-soft); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--accent); flex: none; overflow: hidden; }
  .quick-meta { min-width: 0; }
  .quick-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .quick-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .quick-go { margin-left: auto; color: var(--accent); font-size: 11px; font-weight: 700; }
  .pw-form { display: flex; flex-direction: column; gap: 12px; }
  .pw-form label { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; color: var(--muted); font-weight: 600; margin: 0; }
  .pw-form input { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: #fdfbff; color: var(--text); outline: none; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; transition: border-color 0.16s ease, box-shadow 0.16s ease; }
  .pw-form input:focus { border-color: rgba(122, 92, 255, 0.5); box-shadow: 0 0 0 4px rgba(122, 92, 255, 0.1); }
  .pw-form button { border-radius: 999px; padding: 12px; background: var(--gradient); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px; }
  .pw-msg { min-height: 18px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  .pw-msg a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .status { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9821a; box-shadow: 0 0 0 4px rgba(201, 130, 26, 0.14); }
  .dot.ok { background: #1f9c78; box-shadow: 0 0 0 4px rgba(31, 156, 120, 0.14); }
  .dot.err { background: #d8446f; box-shadow: 0 0 0 4px rgba(216, 68, 111, 0.14); }
  .url { margin-top: 10px; font-size: 10.5px; color: var(--muted); word-break: break-all; line-height: 1.6; }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0d0a17; --text: #f6f1ff; --text-2: #cfc6e6; --muted: #948cab;
      --line: #2a2242; --line-strong: #372d55; --accent: #b9a3ff;
      --gradient: linear-gradient(118deg, #9a7bff 0%, #c58bff 42%, #ff92c4 100%);
      --shadow: 0 32px 80px rgba(0, 0, 0, 0.6);
    }
    body {
      background:
        radial-gradient(900px 520px at 88% -8%, rgba(255, 122, 182, 0.16), transparent 62%),
        radial-gradient(760px 480px at 4% 0%, rgba(122, 92, 255, 0.18), transparent 60%),
        var(--bg);
    }
    .box { background: linear-gradient(170deg, #191228, #140f22); }
    input, .pw-form input { background: #140f22; color: var(--text); }
    .tabs { background: #140f22; }
    .tab.active { background: #1f1734; color: var(--accent); }
    .qr-refresh, .quick-card { background: #171128; }
    /* 二维码区域始终是白底，深色模式下文字要保持深色。 */
    .qr .wait { color: #6f6887; }
    .quick-avatar { background: rgba(154, 123, 255, 0.16); }
    .foot { border-color: var(--line); }
  }
</style>
</head>
<body>
<div class="box">
  <div class="brand"><div class="logo"></div><div><b>SHADOW DREAM</b><span>影梦 · QQ 登录</span></div></div>
  <div class="quick-panel hidden" id="quick-panel">
    <div class="quick-title"><span>一键登录</span><span>已保存的 QQ</span></div>
    <div class="quick-list" id="quick-list"></div>
  </div>
  <div class="tabs">
    <button type="button" class="tab active" data-mode="qrcode">扫码登录</button>
    <button type="button" class="tab" data-mode="password">密码登录</button>
  </div>
  <h1 id="login-title">扫码登录 QQ</h1>
  <p id="login-hint">用手机 QQ 扫描二维码。登录成功后本页会自动切换到 Shadow Dream 控制台。</p>
  <div id="qr-panel">
    <div class="qr"><img id="qr" alt="QQ 登录二维码" /><div class="wait" id="wait">正在向 QQ 请求二维码…</div></div>
    <button type="button" class="qr-refresh" id="qr-refresh">刷新二维码</button>
    <div class="url" id="url"></div>
  </div>
  <form id="pw-panel" class="pw-form hidden">
    <label>QQ 号<input id="pw-uin" inputmode="numeric" autocomplete="username" placeholder="10001" /></label>
    <label>密码<input id="pw-password" type="password" autocomplete="current-password" placeholder="QQ 密码" /></label>
    <button type="submit" id="pw-submit">登录</button>
    <div class="pw-msg" id="pw-msg"></div>
  </form>
  <div class="status"><span class="dot" id="dot"></span><span id="status">等待 QQ 登录服务</span></div>
  <div class="foot">密码只在本机内存中计算 MD5 后交给 QQ 登录服务，不保存、不上传。</div>
</div>
<script>
(async function () {
  var img = document.getElementById('qr');
  var wait = document.getElementById('wait');
  var dot = document.getElementById('dot');
  var status = document.getElementById('status');
  var url = document.getElementById('url');
  var reloading = false;
  var mode = 'qrcode';
  var qrPanel = document.getElementById('qr-panel');
  var pwPanel = document.getElementById('pw-panel');
  var pwMsg = document.getElementById('pw-msg');
  var loginTitle = document.getElementById('login-title');
  var loginHint = document.getElementById('login-hint');
  var quickPanel = document.getElementById('quick-panel');
  var quickList = document.getElementById('quick-list');
  var lastAccounts = '';
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function renderAccounts(accounts) {
    var json = JSON.stringify(accounts || []);
    if (json === lastAccounts) return;
    lastAccounts = json;
    if (!accounts || accounts.length === 0) {
      quickPanel.classList.add('hidden');
      quickList.innerHTML = '';
      return;
    }
    quickPanel.classList.remove('hidden');
    quickList.innerHTML = accounts.map(function (account) {
      var name = account.nickName || ('QQ ' + account.uin);
      var avatar = account.faceUrl
        ? '<img class="quick-avatar" src="' + esc(account.faceUrl) + '" alt="" />'
        : '<div class="quick-avatar">' + esc(name.slice(0, 1)) + '</div>';
      return '<button type="button" class="quick-card" data-uin="' + esc(account.uin) + '">'
        + avatar
        + '<div class="quick-meta"><div class="quick-name">' + esc(name) + '</div>'
        + '<div class="quick-sub">QQ ' + esc(account.uin) + (account.isQuickLogin ? ' · 快速登录' : '') + '</div></div>'
        + '<span class="quick-go">一键登录</span>'
        + '</button>';
    }).join('');
    quickList.querySelectorAll('.quick-card').forEach(function (button) {
      button.addEventListener('click', function () { quickLogin(button.dataset.uin, button); });
    });
  }
  async function quickLogin(uin, button) {
    if (!uin) return;
    button.disabled = true;
    setStatus('正在登录 QQ ' + uin + '…', '');
    try {
      var res = await fetch('/webui/api/login/quick', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uin: uin })
      });
      var data = await res.json();
      if (data.ok) {
        setStatus('登录成功，正在启动 Shadow Dream…', 'ok');
        setTimeout(function () { location.reload(); }, 1800);
      } else {
        button.disabled = false;
        setStatus(data.message || '一键登录失败', 'err');
      }
    } catch (e) {
      button.disabled = false;
      setStatus('一键登录请求失败：' + (e.message || e), 'err');
    }
  }
  var qrRefresh = document.getElementById('qr-refresh');
  qrRefresh.addEventListener('click', async function () {
    qrRefresh.disabled = true;
    try {
      var res = await fetch('/webui/api/login/qr/refresh', { method: 'POST' });
      var data = await res.json();
      if (!data.ok) {
        setStatus(data.message || '刷新二维码失败', 'err');
      } else {
        setStatus('正在刷新二维码…', '');
      }
    } catch (e) {
      setStatus('刷新请求失败：' + (e.message || e), 'err');
    } finally {
      setTimeout(function () { qrRefresh.disabled = false; }, 1200);
    }
  });
  document.querySelectorAll('.tab').forEach(function (button) {
    button.addEventListener('click', function () {
      mode = button.dataset.mode;
      document.querySelectorAll('.tab').forEach(function (item) {
        item.classList.toggle('active', item === button);
      });
      qrPanel.classList.toggle('hidden', mode !== 'qrcode');
      pwPanel.classList.toggle('hidden', mode !== 'password');
      loginTitle.textContent = mode === 'qrcode' ? '扫码登录 QQ' : '密码登录 QQ';
      loginHint.textContent = mode === 'qrcode'
        ? '用手机 QQ 扫描二维码。登录成功后本页会自动切换到 Shadow Dream 控制台。'
        : '使用 QQ 号 + 密码登录。密码在服务端计算 MD5 后交给 QQ 登录服务，不保存。';
    });
  });
  document.getElementById('pw-panel').addEventListener('submit', async function (event) {
    event.preventDefault();
    var uin = document.getElementById('pw-uin').value.trim();
    var password = document.getElementById('pw-password').value;
    if (!/^[0-9]{5,12}$/.test(uin)) { pwMsg.textContent = 'QQ 号格式不对'; return; }
    if (!password) { pwMsg.textContent = '请输入密码'; return; }
    document.getElementById('pw-submit').disabled = true;
    pwMsg.textContent = '正在登录…';
    try {
      var res = await fetch('/webui/api/login/password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uin: uin, password: password })
      });
      var data = await res.json();
      if (data.ok) {
        pwMsg.textContent = '登录成功，正在启动 Shadow Dream…';
        setStatus('登录成功，正在启动 Shadow Dream…', 'ok');
        setTimeout(function () { location.reload(); }, 2000);
      } else {
        pwMsg.textContent = data.message || '登录失败';
        if (data.jumpUrl) {
          pwMsg.innerHTML = (data.message || '需要验证') + '：<a href="' + data.jumpUrl + '" target="_blank" rel="noreferrer">打开验证页面</a>';
        }
        setStatus(data.message || '密码登录失败', 'err');
      }
    } catch (e) {
      pwMsg.textContent = '请求失败：' + (e.message || e);
    } finally {
      document.getElementById('pw-submit').disabled = false;
    }
  });
  function setStatus(text, kind) {
    status.textContent = text;
    dot.className = 'dot' + (kind === 'ok' ? ' ok' : (kind === 'err' ? ' err' : ''));
  }
  async function tick() {
    try {
      var res = await fetch('/webui/api/login/status', { cache: 'no-store' });
      var data = await res.json();
      if (data.image) {
        img.src = data.image;
        img.style.display = 'block';
        wait.style.display = 'none';
      }
      var phase = data.phase || 'starting';
      var map = {
        starting: '等待 QQ 登录服务',
        refreshing: '正在刷新二维码…',
        connected: 'QQ 登录服务已连接，请求二维码…',
        waiting: '请用手机 QQ 扫码',
        scanned: '已扫码，请在手机上确认',
        success: '登录成功，正在启动 Shadow Dream…',
        expired: '二维码已过期，正在刷新…',
        error: '登录失败：' + (data.error || '未知错误')
      };
      status.textContent = map[phase] || phase;
      dot.className = 'dot' + (phase === 'success' ? ' ok' : (phase === 'error' ? ' err' : ''));
      url.textContent = data.url || '';
      renderAccounts(data.accounts);
      if (phase === 'success' && !reloading) {
        reloading = true;
        status.textContent = '登录成功，等待控制台启动…';
        setTimeout(function () { location.reload(); }, 2500);
      }
    } catch (e) {
      status.textContent = '等待控制台启动…';
      dot.className = 'dot ok';
      if (!reloading) {
        reloading = true;
        setTimeout(function () { location.reload(); }, 2000);
      }
    }
    setTimeout(tick, 1200);
  }
  tick();
})();
</script>
</body>
</html>
